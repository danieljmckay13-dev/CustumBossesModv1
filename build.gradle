plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.75'
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

version = '1.0.0'
group = 'com.example.custommod'

repositories {
    mavenCentral()
}

base {
    archivesName = 'custombossesmod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.0.167'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        custombossesmod {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
}
